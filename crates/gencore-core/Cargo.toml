[package]
name = "gencore-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared core types, typed errors, and the app-info command for GenCore Tauri plugins."
links = "gencore-core"

[dependencies]
tauri = { workspace = true, features = ["image-png", "tray-icon"] }
serde = { workspace = true }
thiserror = { workspace = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }

[dev-dependencies]
serde_json = { workspace = true }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
    "Win32_UI_WindowsAndMessaging",
] }
