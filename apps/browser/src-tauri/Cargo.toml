[package]
name = "gencore-browser-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GenCore Browser — standalone Tauri 2 + Vite + React template app."
publish = false

[lib]
name = "gencore_browser_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gencore-browser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = ["codegen", "isolation"] }

[dependencies]
tauri = { workspace = true, features = ["isolation", "tray-icon", "image-png", "unstable"] }
serde = { workspace = true }
serde_json = { workspace = true }
gencore-core = { path = "../../../crates/gencore-core" }
gencore-browser = { path = "../../../crates/gencore-plugin-browser" }
tauri-plugin-opener = { workspace = true }
