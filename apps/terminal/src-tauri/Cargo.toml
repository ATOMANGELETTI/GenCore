[package]
name = "gencore-terminal"
version = "0.1.0"
description = "GenCore Terminal — standalone Tauri 2 + Vite + React template shell."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "gencore_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = ["isolation"] }

[dependencies]
tauri = { workspace = true, features = ["isolation"] }
serde = { workspace = true }
serde_json = { workspace = true }
gencore-core = { path = "../../../crates/gencore-core" }
gencore-pty = { path = "../../../crates/gencore-plugin-pty" }
tauri-plugin-opener = { workspace = true }
