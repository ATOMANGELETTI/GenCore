[workspace]
resolver = "2"
members = [
    "crates/gencore-core",
    "crates/gencore-plugin-pty",
    "crates/gencore-plugin-fs",
    "crates/gencore-plugin-assistant",
    "crates/gencore-plugin-git",
    "crates/gencore-plugin-browser",
    "apps/terminal/src-tauri",
    "apps/explorer/src-tauri",
    "apps/browser/src-tauri",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Dustin Angeletti"]
repository = "https://github.com/ATOMANGELETTI/GenCore"

[workspace.dependencies]
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin = "2.6.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tauri-plugin-opener = "2.5.4"
