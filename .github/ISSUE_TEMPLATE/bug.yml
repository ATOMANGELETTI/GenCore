name: Bug report
description: Report a defect in one of the GenCore apps, crates, or packages.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please search existing
        issues first to avoid duplicates.

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Which part of the monorepo does this affect?
      options:
        - "@gencore/terminal (apps/terminal)"
        - "@gencore/explorer (apps/explorer)"
        - "@gencore/ui-kit (packages/ui-kit)"
        - "gencore-core (crates/gencore-core)"
        - "gencore-pty (crates/gencore-plugin-pty)"
        - "gencore-fs (crates/gencore-plugin-fs)"
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so a maintainer can reproduce the issue locally.
      placeholder: |
        1. Run `pnpm dev`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App / commit version
      placeholder: "e.g. v0.1.0 or commit SHA"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
    validations:
      required: false
