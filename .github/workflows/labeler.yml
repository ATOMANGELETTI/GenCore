name: Pull Request Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    steps:
      # Uses the `pull_request` event (not `pull_request_target`) so the
      # labeler only ever reads the config and diff of the merge commit
      # GitHub already builds for the trigger — no checkout of PR code and
      # no elevated token exposure to fork PRs.
      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for name in \
            app-terminal \
            app-explorer \
            pkg-ui-kit \
            crate-core \
            crate-pty \
            crate-fs \
            ci \
            bug \
            enhancement \
            question
          do
            gh label create "$name" --force
          done

      - name: Label PR based on changed paths
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

