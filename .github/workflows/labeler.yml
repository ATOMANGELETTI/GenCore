name: Pull Request Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    steps:
      # Uses the `pull_request` event (not `pull_request_target`) so the
      # labeler only ever reads the config and diff of the merge commit
      # GitHub already builds for the trigger — no checkout of PR code and
      # no elevated token exposure to fork PRs.
      - name: Label PR based on changed paths
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
