name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      # All workspace packages are private (see package.json `private: true`
      # at every level). This step only opens/updates the Changesets
      # "Version Packages" PR — it never calls `changeset publish`, so no
      # NPM_TOKEN is required or configured.
      - name: Create Release Pull Request
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
