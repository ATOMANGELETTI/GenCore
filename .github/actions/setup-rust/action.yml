name: Setup Rust toolchain
description: >-
  Installs the Rust toolchain pinned in rust-toolchain.toml (stable,
  rustfmt, clippy) and configures build caching via actions-rust-lang's
  bundled Swatinem/rust-cache integration.

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy
