name: Setup Node & pnpm
description: >-
  Installs Node.js, enables Corepack and the pnpm version pinned in
  package.json, re-runs setup-node with pnpm store caching, and installs
  workspace dependencies with a frozen lockfile.

inputs:
  node-version:
    description: Optional override. When empty, reads .node-version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: inputs.node-version != ''
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Node.js
      if: inputs.node-version == ''
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version

    - name: Enable Corepack
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: corepack enable && corepack prepare --activate

    - name: Setup Node.js with pnpm cache
      if: inputs.node-version != ''
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Setup Node.js with pnpm cache
      if: inputs.node-version == ''
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
